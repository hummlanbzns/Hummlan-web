<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Hexagon frame -->
  <polygon points="50,2 90,26 90,74 50,98 10,74 10,26" fill="none" stroke="#2D2D2D" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Wings - left -->
  <ellipse cx="30" cy="36" rx="16" ry="12" fill="#F5F0E8" stroke="#2D2D2D" stroke-width="2.5" transform="rotate(-15 30 36)"/>
  <!-- Wing vein -->
  <path d="M22 36 Q30 28 38 36" stroke="#2D2D2D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Wings - right -->
  <ellipse cx="70" cy="36" rx="16" ry="12" fill="#F5F0E8" stroke="#2D2D2D" stroke-width="2.5" transform="rotate(15 70 36)"/>
  <!-- Wing vein -->
  <path d="M62 36 Q70 28 78 36" stroke="#2D2D2D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="50" cy="68" rx="14" ry="18" fill="#F59127" stroke="#2D2D2D" stroke-width="2.5"/>
  <!-- Body stripes -->
  <rect x="37" y="58" width="26" height="5" rx="2.5" fill="#F5F0E8" stroke="#2D2D2D" stroke-width="1.2"/>
  <rect x="37" y="70" width="26" height="5" rx="2.5" fill="#F5F0E8" stroke="#2D2D2D" stroke-width="1.2"/>
  <!-- Head -->
  <circle cx="50" cy="28" r="10" fill="#F59127" stroke="#2D2D2D" stroke-width="2.5"/>
  <!-- Antennae -->
  <path d="M45 20 L38 10" stroke="#2D2D2D" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="38" cy="10" r="2" fill="#2D2D2D"/>
  <path d="M55 20 L62 10" stroke="#2D2D2D" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="62" cy="10" r="2" fill="#2D2D2D"/>
  <!-- Stinger -->
  <path d="M50 85 L47 93" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50 85 L53 93" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
</svg>